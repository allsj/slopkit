<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 28%, #18233a 0, #0c111b 44%, #07090e 100%);
    color: #c8ced8;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }
  .logo {
    width: 96px; height: 96px; border-radius: 22px;
    background: linear-gradient(135deg, #1e2d45, #131c2b);
    border: 2px solid #2a3a52;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 48px; height: 48px; }
  .brand {
    font: 700 28px/1 "Segoe UI", system-ui, sans-serif;
    color: #eceff4; letter-spacing: .04em;
  }
  #actions {
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
  }
  .action {
    box-sizing: border-box; display: inline-block; min-width: 200px;
    padding: 17px 36px; border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px; color: #fff;
    background: linear-gradient(135deg, #3b8cff, #1957c8);
    box-shadow: 0 12px 30px rgba(18,79,190,.32), inset 0 1px rgba(255,255,255,.18);
    font: 700 20px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .03em; text-align: center;
    text-decoration: none; cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .action:focus {
    outline: none; transform: translateY(-3px);
    border-color: #fff;
    box-shadow: 0 0 0 4px rgba(91,158,255,.3), 0 16px 36px rgba(18,79,190,.45);
  }
  .action:active { transform: translateY(1px); }
  #status { min-height: 1.5em; color: #6d7788; font-size: 14px; }
  @media (max-width: 650px) {
    #actions { width: 82vw; }
    .action { width: 100%; }
  }
</style>
</head>
<body>

<div id="wrap">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5e81ac" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16.5" r="1.5"/>
    </svg>
  </div>
  <div class="brand">SLOPKIT</div>
  <div id="actions">
    <a id="start" class="action"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;production=1&amp;trigger=netcontrol&amp;attempts=8&amp;only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&amp;log=debug&amp;payload=1&amp;v=41"
       tabindex="0">开始运行</a>
  </div>
  <div id="status">运行前请先重启主机</div>
</div>

<script>try {
    document.getElementById("start").focus();
} catch (e) {}
</script>

</body>
</html>
